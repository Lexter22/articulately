name: Keep Supabase Alive

on:
  schedule:
    # Midnight UTC on Sunday (0) and Friday (5)
    - cron: '0 0 * * 0,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing or empty"
            exit 1
          fi

          # Strip any trailing slash so the path never becomes //rest/v1
          BASE_URL="${SUPABASE_URL%/}"

          # --fail makes curl exit non-zero on HTTP 4xx/5xx, so the job turns red
          # instead of silently passing on a bad key or wrong URL.
          STATUS=$(curl --silent --show-error --fail \
            --retry 3 --retry-delay 5 --max-time 30 \
            --output response.json --write-out "%{http_code}" \
            "${BASE_URL}/rest/v1/flashcards?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${STATUS}"
          echo "Response: $(cat response.json)"
